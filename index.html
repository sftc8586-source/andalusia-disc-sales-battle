<!doctype html><html lang="ms"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Andalusia DISC Battle</title><style>body{font:17px system-ui;margin:0;background:#f8f3e8;color:#123f33}header{background:#074435;color:#ebc97f;text-align:center;padding:20px}main{max-width:840px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d8c290;border-radius:18px;padding:20px;margin:14px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #bca576;margin:5px}button{cursor:pointer;background:#f7f1e4}button.primary{background:#07533e;color:white}input{width:92%}h2{margin:5px 0 12px}.quote{background:#f6e9c8;padding:20px;border-radius:12px}.choices button{display:block;text-align:left;width:99%;margin:9px 0}.hidden{display:none}.small{color:#667c71;font-size:14px}body{background:radial-gradient(circle at top,#e8d9ad,#f5f0e5 48%,#e7eadf);min-height:100vh}header{background:linear-gradient(135deg,#032b26,#08644c 55%,#082b28);padding:32px 18px;border-bottom:5px solid #c59b47;box-shadow:0 8px 24px #12382b25}header h1{font-size:clamp(25px,4.1vw,42px);letter-spacing:1.5px;text-shadow:0 3px 10px #0003}main{max-width:1040px}.card{box-shadow:0 9px 28px #17433618;border:1px solid #d7bd7d;border-radius:22px;padding:27px;animation:appear .35s ease-out}.card h2{color:#0a5542}button{transition:transform .15s,box-shadow .15s;background:#fff8e9}button:hover{transform:translateY(-2px);box-shadow:0 5px 13px #123d3228}button:active{transform:scale(.98)}button.primary{background:linear-gradient(120deg,#07533e,#088062);font-weight:700}.quote{font-size:clamp(19px,2.5vw,26px);font-weight:600;line-height:1.6;box-shadow:inset 0 0 0 1px #dbbe6e}.choices button{padding:20px;font-size:17px;line-height:1.5}.choices button:hover{border:2px solid #ad8439}.small{font-size:14px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{background:#eef5ee;border-radius:12px;padding:12px 16px;font-weight:700}#admin> .card:first-child{background:linear-gradient(135deg,#f8f0d6,#fff)}#admin img{border:8px solid #f5e4b6;border-radius:12px}#admin .card:last-child button{margin:6px}#admin .card:last-child button.primary{background:#075b42}.hidden{display:none!important}@keyframes appear{from{opacity:.35;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{padding:10px}.card{padding:18px}header{padding:24px 8px}button{min-height:44px}} .joined-list{display:flex;flex-wrap:wrap;gap:10px;padding-top:10px}.joined-name{display:inline-block;background:#e8f4e8;color:#07533e;padding:12px 16px;border:1px solid #a6bf9a;border-radius:12px;font-weight:700;animation:appear .3s ease}.joined-name:before{content:'✓ ';color:#0a8a54} </style><header><h1>ANDALUSIA DISC SALES BATTLE</h1><div>MISSION 01 • WHATSAPP • EMERALD & GOLD</div></header><main><section id="entry" class="card"><h2>Pilih paparan</h2><button onclick="openTrainer()">Trainer</button><button onclick="openPlayer()">Peserta</button></section><section id="trainer" class="hidden"><div class="card"><h2>Trainer Control</h2><input id="pin" placeholder="Masukkan PIN trainer" type="password"><button class="primary" onclick="auth()">Log masuk</button></div><div id="admin"></div></section><section id="player" class="hidden"><div id="join" class="card"><h2>Join Game</h2><input id="name" placeholder="Nama peserta"><input id="code" placeholder="Kod sesi"><button class="primary" onclick="join()">JOIN</button></div><div id="play"></div></section><p id="error"></p></main><script>
let role='',pin=sessionStorage.pin||'',token=sessionStorage.token||'',state=null;const $=id=>document.getElementById(id);
const phases=['lobby','story','response','rescue','disc','reveal','closing1','closing2','bonus','leaderboard'];
const labels=['LOBI QR','SITUASI','SOALAN A/B/C','RESCUE CARD','TEKA DISC','REVEAL DISC','CLOSING 1','CLOSING 2','MARKAH BONUS','LEADERBOARD'];
const quote='“Assalamualaikum. Saya sibuk dan tak ada masa nak baca mesej panjang. Saya nak tahu harga penuh, tarikh dan lokasi hotel. Boleh ringkaskan yang penting sahaja?”';
const answers={A:'Tuan, saya terangkan sejarah Andalusia dan semua jenis pakej kami dahulu.',B:'Baik tuan. Saya ringkaskan tarikh, harga penuh, lokasi hotel dan perkara yang termasuk. Tuan sasarkan perjalanan berapa hari?',C:'Tuan bayar deposit dahulu, kemudian saya hantarkan butiran lengkap.'};
const closings=['Saya nak pilihan yang praktikal, tetapi saya tiada masa untuk teliti semua pakej. Apa yang awak cadangkan?','Saya masih banding dengan agensi lain. Apa yang membezakan pakej ini dan apa langkah seterusnya?'];
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','x-trainer-pin':pin,'x-player-token':token},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
function error(e){$('error').textContent=e.message||e}
function openTrainer(){role='trainer';$('entry').className='hidden';$('trainer').className='';$('player').className='hidden';$('pin').value=pin;refresh()}
function openPlayer(){role='player';$('entry').className='hidden';$('trainer').className='hidden';$('player').className='';$('code').value=new URLSearchParams(location.search).get('code')||'';refresh()}
function auth(){pin=$('pin').value;sessionStorage.pin=pin;refresh()}
async function join(){try{let j=await api('join',{name:$('name').value,code:$('code').value});token=j.token;sessionStorage.token=token;refresh()}catch(e){error(e)}}
async function answer(value){try{await api('answer',{answer:value});refresh()}catch(e){error(e)}}
async function change(p){try{await api('phase',{phase:p});refresh()}catch(e){error(e)}}
async function select(){try{await api('select',{ids:[$('p1').value,$('p2').value]});refresh()}catch(e){error(e)}}
async function mark(i){try{await api('bonus',{id:state.selected[i],score:Number($('mark'+i).value)});refresh()}catch(e){error(e)}}
const story=()=>'<div class="card"><h2>Situasi WhatsApp: Encik Hakim</h2><p>Encik Hakim seorang pelanggan yang mahu maklumat ringkas kerana jadualnya padat. Beliau meminta pilihan yang jelas dan mahu membandingkan butiran penting sebelum membuat keputusan.</p><div class="quote">'+quote+'</div></div>';
const rescue=()=>'<div class="card"><h2>RESCUE CARD — B</h2><p>Respons B menjawab permintaan secara ringkas dan menanyakan satu soalan penentu. A terlalu panjang; C meminta bayaran tanpa penerangan.</p></div>';
const reveal=()=>'<div class="card"><h2>DISC: D — Dominance</h2><p>Watak ini mengutamakan masa, keputusan dan pilihan yang jelas. Jangan andaikan personaliti daripada pendapatan atau satu mesej sahaja.</p></div>';
const quiz=(me)=>'<div class="card"><h2>Pilih respons terbaik</h2><div class="choices">'+Object.entries(answers).map(([k,v])=>'<button '+(me?.response?'disabled':'')+' onclick="answer(\''+k+'\')">'+k+'. '+v+'</button>').join('')+'</div>'+(me?.response?'<p>Jawapan dihantar: '+esc(me.response)+'</p>':'')+'</div>';
const disc=me=>'<div class="card"><h2>Kenal pasti DISC pelanggan</h2>'+['D','I','S','C'].map(x=>'<button '+(me?.disc?'disabled':'')+' onclick="answer(\''+x+'\')">'+x+'</button>').join('')+(me?.disc?'<p>Jawapan dihantar: '+esc(me.disc)+'</p>':'')+'</div>';
const board=s=>'<div class="card"><h2>Leaderboard</h2>'+s.ranking.map((p,i)=>'<p>'+(i+1)+'. '+esc(p.name)+' — '+esc(p.total??'menunggu')+' mata</p>').join('')+'</div>';
function renderTrainer(s){let idx=phases.indexOf(s.phase),url=location.origin+'/?code='+s.code;let h='<div class="card"><h2>'+labels[idx]+'</h2><p>👥 Peserta: '+s.count+' &nbsp; | &nbsp; ✅ A/B/C: '+s.answered+' &nbsp; | &nbsp; 🧠 DISC: '+s.discAnswered+'</p></div>';
if(idx===0)h+='<div class="card"><h2>Scan QR / Join Game</h2><img alt="QR" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url)+'"><p>Kod sesi: <b>'+s.code+'</b></p><p>'+esc(url)+'</p></div><div class="card"><h2>✅ Peserta telah masuk ('+s.count+')</h2><div class="joined-list">'+(s.players.length?s.players.map((p,i)=>'<span class="joined-name">'+(i+1)+'. '+esc(p.name)+'</span>').join(''):'<p>Menunggu peserta scan QR...</p>')+'</div></div>';
if(idx>=1&&idx<=8)h+=story();
if(idx===2)h+=quiz({response:'X'});
if(idx===3)h+=rescue();
if(idx===4)h+=disc({disc:'X'});
if(idx>=5&&idx<=8)h+=reveal();
if(idx===6||idx===7)h+='<div class="card"><h2>Live Closing '+(idx-5)+'</h2><div class="quote">'+closings[idx-6]+'</div><p>60 saat untuk menjawab secara lisan.</p></div>';
if(idx>=6&&idx<=8){let list='<option value="">Pilih peserta</option>'+s.players.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');h+='<div class="card"><h2>Pilih dua peserta</h2><select id="p1">'+list+'</select><select id="p2">'+list+'</select><button onclick="select()">Simpan Pilihan</button><p>Terpilih: '+s.selected.map(id=>esc(s.players.find(p=>p.id===id)?.name||'—')).join(' / ')+'</p></div>'}
if(idx===8)h+='<div class="card"><h2>Bonus 0–20</h2>'+s.selected.map((id,i)=>'<p>'+esc(s.players.find(p=>p.id===id)?.name||'—')+'</p><input id="mark'+i+'" type="number" value="0" min="0" max="20"><button onclick="mark('+i+')">Simpan Bonus</button>').join('')+'</div>';
if(idx===9)h+=board(s);
h+='<div class="card"><h2>Kawalan langkah demi langkah</h2>'+phases.map((x,i)=>'<button '+(idx===i?'class="primary"':'')+' onclick="change(\''+x+'\')">'+(i+1)+'. '+labels[i]+'</button>').join('')+'</div>';$('admin').innerHTML=h}
function renderPlayer(s){if(!s.me){$('join').className='card';if(s.code && !$('code').matches(':focus')) $('code').value=s.code;$('play').innerHTML=s.phase==='lobby'?'<div class="card"><p>Masukkan nama dan tekan JOIN. Kod sesi aktif telah dikemas kini secara automatik.</p></div>':'';return}$('join').className='hidden';let h='<div class="card">Selamat datang, <b>'+esc(s.me.name)+'</b><p>'+labels[phases.indexOf(s.phase)]+'</p></div>';switch(s.phase){case'lobby':h+='<div class="card">Menunggu trainer...</div>';break;case'story':h+=story();break;case'response':h+=story()+quiz(s.me);break;case'rescue':h+=rescue();break;case'disc':h+=disc(s.me);break;case'reveal':h+=reveal();break;case'closing1':case'closing2':h+='<div class="card"><h2>Live Closing Challenge</h2><p>'+esc(closings[s.phase==='closing1'?0:1])+'</p>Jawab secara lisan apabila dipanggil.</div>';break;case'bonus':h+='<div class="card">Trainer sedang memberikan markah.</div>';break;case'leaderboard':h+=board(s)}$('play').innerHTML=h}
let lastPhase='',lastCount=-1,lastAnswers=-1,lastDisc=-1;
async function refresh(){if(!role)return;try{let next=await api('state');let focused=document.activeElement;let editing=role==='trainer'&&focused&&['SELECT','INPUT'].includes(focused.tagName)&&focused.id!=='pin';let same=next.phase===lastPhase;let unchanged=same&&next.count===lastCount&&next.answered===lastAnswers&&next.discAnswered===lastDisc;state=next;
if(editing&&same)return;
if(role==='trainer'&&unchanged)return;
$('error').textContent='';if(role==='trainer')renderTrainer(state);else renderPlayer(state);
lastPhase=next.phase;lastCount=next.count;lastAnswers=next.answered;lastDisc=next.discAnswered;
}catch(e){if(role==='trainer')$('admin').innerHTML='<div class="card">Masukkan PIN trainer yang ditetapkan pada hosting.</div>';else error(e)}}
setInterval(refresh,2000);if(location.search.includes('code='))openPlayer();
</script></html>
