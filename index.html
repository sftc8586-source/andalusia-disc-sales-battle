<!doctype html><html lang="ms"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Andalusia DISC Battle</title><style>body{font:17px system-ui;margin:0;background:#f8f3e8;color:#123f33}header{background:#074435;color:#ebc97f;text-align:center;padding:20px}main{max-width:840px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d8c290;border-radius:18px;padding:20px;margin:14px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #bca576;margin:5px}button{cursor:pointer;background:#f7f1e4}button.primary{background:#07533e;color:white}input{width:92%}h2{margin:5px 0 12px}.quote{background:#f6e9c8;padding:20px;border-radius:12px}.choices button{display:block;text-align:left;width:99%;margin:9px 0}.hidden{display:none}.small{color:#667c71;font-size:14px}body{background:radial-gradient(circle at top,#e8d9ad,#f5f0e5 48%,#e7eadf);min-height:100vh}header{background:linear-gradient(135deg,#032b26,#08644c 55%,#082b28);padding:32px 18px;border-bottom:5px solid #c59b47;box-shadow:0 8px 24px #12382b25}header h1{font-size:clamp(25px,4.1vw,42px);letter-spacing:1.5px;text-shadow:0 3px 10px #0003}main{max-width:1040px}.card{box-shadow:0 9px 28px #17433618;border:1px solid #d7bd7d;border-radius:22px;padding:27px;animation:appear .35s ease-out}.card h2{color:#0a5542}button{transition:transform .15s,box-shadow .15s;background:#fff8e9}button:hover{transform:translateY(-2px);box-shadow:0 5px 13px #123d3228}button:active{transform:scale(.98)}button.primary{background:linear-gradient(120deg,#07533e,#088062);font-weight:700}.quote{font-size:clamp(19px,2.5vw,26px);font-weight:600;line-height:1.6;box-shadow:inset 0 0 0 1px #dbbe6e}.choices button{padding:20px;font-size:17px;line-height:1.5}.choices button:hover{border:2px solid #ad8439}.small{font-size:14px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{background:#eef5ee;border-radius:12px;padding:12px 16px;font-weight:700}#admin> .card:first-child{background:linear-gradient(135deg,#f8f0d6,#fff)}#admin img{border:8px solid #f5e4b6;border-radius:12px}#admin .card:last-child button{margin:6px}#admin .card:last-child button.primary{background:#075b42}.hidden{display:none!important}@keyframes appear{from{opacity:.35;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{padding:10px}.card{padding:18px}header{padding:24px 8px}button{min-height:44px}} .joined-list{display:flex;flex-wrap:wrap;gap:10px;padding-top:10px}.joined-name{display:inline-block;background:#e8f4e8;color:#07533e;padding:12px 16px;border:1px solid #a6bf9a;border-radius:12px;font-weight:700;animation:appear .3s ease}.joined-name:before{content:'✓ ';color:#0a8a54} .next-btn{display:block;width:100%;font-size:clamp(18px,2.6vw,25px);font-weight:800;padding:20px;margin:17px 0;border-radius:16px;background:linear-gradient(110deg,#086145,#0c8a67)!important;box-shadow:0 7px 18px #0a60402a;letter-spacing:.4px}.progress-track{height:10px;background:#e7e8da;border-radius:99px;overflow:hidden}.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#b8964a,#e3c46b)} .timer-card{text-align:center;background:linear-gradient(130deg,#fff7e7,#e9f3ea);border:2px solid #cbab69}.timer-card #time-display{letter-spacing:4px;font-variant-numeric:tabular-nums}.timer-card button{padding:10px 16px} .mission-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.mission-choice{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:8px;padding:16px;background:linear-gradient(135deg,#fff8e8,#e8f2e8);border:1px solid #bda15b;border-radius:14px;min-height:117px}.mission-choice strong{font-size:16px;color:#0a4c38}.mission-choice:hover{background:#ddf2e4;border-color:#137751} </style><header><h1>ANDALUSIA DISC SALES BATTLE</h1><div>MISSION 01 • WHATSAPP • EMERALD & GOLD</div></header><main><section id="entry" class="card"><h2>Pilih paparan</h2><button onclick="openTrainer()">Trainer</button><button onclick="openPlayer()">Peserta</button></section><section id="trainer" class="hidden"><div class="card"><h2>Trainer Control</h2><input id="pin" placeholder="Masukkan PIN trainer" type="password"><button class="primary" onclick="auth()">Log masuk</button></div><div id="admin"></div></section><section id="player" class="hidden"><div id="join" class="card"><h2>Join Game</h2><input id="name" placeholder="Nama peserta"><input id="code" placeholder="Kod sesi"><button class="primary" onclick="join()">JOIN</button></div><div id="play"></div></section><p id="error"></p></main><script>
let missions=[],missionData=null;let soundOn=true,audioCtx=null,lastTick=-1,clockOffset=0;let role='',pin=sessionStorage.pin||'',token=localStorage.getItem('andalusia_player_token')||sessionStorage.token||'',state=null;const $=id=>document.getElementById(id);
const phases=['lobby','story','response','results','disc','discresults','reveal','rescue','closing1','closing2','bonus','modelanswer','leaderboard'];
const labels=['LOBI QR','MESEJ PELANGGAN','SOALAN A/B/C','KEPUTUSAN UNDIAN','TEKA DISC','KEPUTUSAN DISC','REVEAL DISC','RESCUE CARD','CLOSING 1','CLOSING 2','MARKAH BONUS','CONTOH JAWAPAN PROFESIONAL','LEADERBOARD'];
const current=()=>missionData||missions[0]||{channel:'WhatsApp',title:'Pelanggan',disc:'D',message:'Menunggu misi',answers:{A:'',B:'',C:''},correct:'B',explanation:'',closings:['','']};
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function beep(freq=650,duration=.11){if(!soundOn)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.09,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+duration)}catch(e){}}
function toggleSound(){soundOn=!soundOn;let b=$('sound-toggle');if(b)b.textContent=soundOn?'🔊 BUNYI ON':'🔇 BUNYI OFF';if(soundOn)beep(760,.08)}
async function extendTimer(){try{await api('extend',{seconds:15});refresh()}catch(e){error(e)}}
function timerBox(s,trainer=false){if(!s.deadline)return '';return '<div class="card timer-card"><div style="font-size:15px">⏱️ MASA CABARAN</div><div id="time-display" style="font-size:clamp(46px,9vw,80px);font-weight:900">--:--</div><p class="small">Timer sebagai panduan. Trainer menutup soalan dengan butang SETERUSNYA.</p>'+(trainer?'<button onclick="extendTimer()">+15 SAAT</button><button id="sound-toggle" onclick="toggleSound()">'+(soundOn?'🔊 BUNYI ON':'🔇 BUNYI OFF')+'</button>':'')+'</div>'}
function updateClock(){if(!state||!state.deadline)return;let sec=Math.max(0,Math.ceil((state.deadline-Date.now()-clockOffset)/1000));let e=$('time-display');if(e){e.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');e.style.color=sec<=10?'#b34b35':'#10543e'}if(sec!==lastTick){if(sec>0&&sec<=5)beep(430+sec*80,.12);if(sec===0&&lastTick>0)beep(260,.5);lastTick=sec}}
async function loadMissions(){try{missions=await api('missions');missionData=missions[0]}catch(e){error(e)}}
async function chooseMission(id){try{await api('mission',{id});missionData=missions.find(m=>m.id===id);lastPhase='';refresh()}catch(e){error(e)}}
const chooseMenu=s=>'<div class="card"><h2>🎯 PILIH MISI — 15 CABARAN</h2><p class="small">Bebas pilih mana-mana misi. Markah terkumpul sepanjang sesi.</p><div class="mission-grid">'+missions.map(m=>'<button class="mission-choice" onclick="chooseMission('+m.id+')"><span class="small">MISSION '+String(m.id).padStart(2,'0')+' • '+esc(m.channel)+'</span><strong>'+esc(m.title)+'</strong>'+(s.completed?.includes(m.id)?'<span class="small">✅ SUDAH DIMAINKAN</span>':'')+'</button>').join('')+'</div></div>';
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','x-trainer-pin':pin,'x-player-token':token},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
function error(e){$('error').textContent=e.message||e}
function openTrainer(){role='trainer';$('entry').className='hidden';$('trainer').className='';$('player').className='hidden';$('pin').value=pin;refresh()}
function openPlayer(){role='player';$('entry').className='hidden';$('trainer').className='hidden';$('player').className='';$('code').value=new URLSearchParams(location.search).get('code')||'';refresh()}
function auth(){pin=$('pin').value;sessionStorage.pin=pin;refresh()}
async function join(){try{let j=await api('join',{name:$('name').value,code:$('code').value});token=j.token;sessionStorage.token=token;localStorage.setItem('andalusia_player_token',token);refresh()}catch(e){error(e)}}
async function answer(value){try{await api('answer',{answer:value});refresh()}catch(e){error(e)}}
async function change(p){try{await api('phase',{phase:p});refresh()}catch(e){error(e)}}
async function select(){try{await api('select',{ids:[$('p1').value,$('p2').value]});refresh()}catch(e){error(e)}}
async function mark(i){try{await api('bonus',{id:state.selected[i],score:Number($('mark'+i).value)});refresh()}catch(e){error(e)}}
const story=()=>{let m=current();return '<div class="card"><h2>📨 '+esc(m.channel)+' — '+esc(m.title)+'</h2><p class="small">Baca komunikasi pelanggan dan kenal pasti keperluannya.</p><div class="quote">'+esc(m.message)+'</div></div>'};
const rescue=()=>{let m=current();return '<div class="card"><h2>✦ RESCUE CARD — '+esc(m.correct)+'</h2><p>'+esc(m.explanation)+'</p><div class="quote">'+esc(m.answers[m.correct])+'</div></div>'};
const results=s=>'<div class="card"><h2>📊 KEPUTUSAN UNDIAN A/B/C</h2><p><b>'+s.answered+' daripada '+s.count+' peserta telah menjawab</b></p>'+['A','B','C'].map(k=>{let n=s.responseCounts?.[k]||0,p=s.answered?Math.round(n/s.answered*100):0;return '<div style="margin:20px 0"><p><b>Jawapan '+k+'</b> — '+n+' peserta ('+p+'%)</p><div class="progress-track" style="height:22px"><div class="progress-fill" style="width:'+p+'%;background:#b59a68"></div></div></div>'}).join('')+'<p class="small">Jawapan terbaik belum didedahkan. Seterusnya, peserta akan meneka DISC pelanggan.</p></div>';
const discResults=s=>'<div class="card"><h2>📊 KEPUTUSAN UNDIAN DISC</h2><p><b>'+s.discAnswered+' daripada '+s.count+' peserta telah memilih DISC</b></p>'+['D','I','S','C'].map(k=>{let n=s.discCounts?.[k]||0,p=s.discAnswered?Math.round(n/s.discAnswered*100):0;return '<div style="margin:20px 0"><p><b>DISC '+k+'</b> — '+n+' peserta ('+p+'%)</p><div class="progress-track" style="height:22px"><div class="progress-fill" style="width:'+p+'%;background:#b59a68"></div></div></div>'}).join('')+'<p class="small">Gaya DISC watak belum didedahkan. Trainer tekan Seterusnya untuk Reveal DISC.</p></div>';
const reveal=()=>'<div class="card"><h2>DISC: '+esc(current().disc)+'</h2><p>'+esc(current().explanation)+'</p><p class="small">Ini gaya komunikasi dalam simulasi, bukan diagnosis personaliti individu.</p></div>';
const quiz=(me)=>'<div class="card"><h2>Apakah respons PALING sesuai untuk pelanggan ini?</h2><p class="small">Teliti tiga pilihan yang hampir sama munasabah.</p><div class="choices">'+Object.entries(current().answers).map(([k,v])=>'<button '+(me?.response?'disabled':'')+' onclick="answer(\''+k+'\')">'+k+'. '+esc(v)+'</button>').join('')+'</div>'+(me?.response?'<p>Jawapan dihantar: '+esc(me.response)+'</p>':'')+'</div>';
const disc=me=>'<div class="card"><h2>Kenal pasti DISC pelanggan</h2>'+['D','I','S','C'].map(x=>'<button '+(me?.disc?'disabled':'')+' onclick="answer(\''+x+'\')">'+x+'</button>').join('')+(me?.disc?'<p>Jawapan dihantar: '+esc(me.disc)+'</p>':'')+'</div>';
const modelAnswer=()=>{let m=current();return '<div class="card"><h2>🌟 CONTOH JAWAPAN PROFESIONAL</h2><p class="small">Berikan maklum balas selepas menilai peserta. Gunakan contoh ini sebagai panduan, bukan skrip tunggal yang wajib.</p><h3>Cabaran 1</h3><div class="quote">'+esc(m.closings[0])+'</div><p><b>Contoh pendekatan:</b> Akui keperluan pelanggan, sahkan fakta berkaitan, berikan pilihan yang jelas dan akhiri dengan satu soalan tindakan tanpa mendesak.</p><h3>Cabaran 2</h3><div class="quote">'+esc(m.closings[1])+'</div><p><b>Contoh pendekatan:</b> Dengar bantahan, terangkan butiran yang boleh disahkan, beri alternatif jika perlu, kemudian persetujuan untuk langkah susulan.</p><p><b>Fokus DISC '+esc(m.disc)+':</b> '+esc(m.explanation)+'</p></div>'};
const board=s=>'<div class="card"><h2>Leaderboard</h2>'+s.ranking.map((p,i)=>'<p>'+(i+1)+'. '+esc(p.name)+' — '+esc(p.total??'menunggu')+' mata</p>').join('')+'</div>';
function renderTrainer(s){missionData=missions.find(m=>m.id===s.mission)||current();let idx=phases.indexOf(s.phase),url=location.origin+'/?code='+s.code;let h=timerBox(s,true)+'<div class="card"><h2>'+labels[idx]+'</h2><p>👥 Peserta: '+s.count+' &nbsp; | &nbsp; ✅ A/B/C: '+s.answered+' &nbsp; | &nbsp; 🧠 DISC: '+s.discAnswered+'</p></div>';
if(idx===0)h+=chooseMenu(s);if(idx===phases.length-1)h+=chooseMenu(s);
if(idx===0)h+='<div class="card"><h2>✅ SENARAI PESERTA TELAH MASUK ('+s.count+')</h2><div class="joined-list">'+(s.players.length?s.players.map((p,i)=>'<span class="joined-name">'+(i+1)+'. '+esc(p.name)+'</span>').join(''):'<p>Menunggu peserta scan QR...</p>')+'</div></div><div class="card"><h2>Scan QR / Join Game</h2><img alt="QR" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url)+'"><p>Kod sesi: <b>'+s.code+'</b></p><p>'+esc(url)+'</p></div>';
if(idx>=1&&idx<=8)h+=story();
if(idx===2)h+=quiz({response:'X'});
if(idx===3)h+=results(s);
if(idx===4)h+=disc({disc:'X'});
if(idx===5)h+=discResults(s);
if(idx===6)h+=reveal();
if(idx===7)h+=rescue();
if(idx===8||idx===9)h+='<div class="card"><h2>Live Closing '+(idx-7)+'</h2><div class="quote">'+current().closings[idx-8]+'</div><p>60 saat untuk menjawab secara lisan.</p></div>';
if(idx>=8&&idx<=10){let list='<option value="">Pilih peserta</option>'+s.players.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');h+='<div class="card"><h2>Pilih dua peserta</h2><select id="p1">'+list+'</select><select id="p2">'+list+'</select><button onclick="select()">Simpan Pilihan</button><p>Terpilih: '+s.selected.map(id=>esc(s.players.find(p=>p.id===id)?.name||'—')).join(' / ')+'</p></div>'}
if(idx===10)h+='<div class="card"><h2>Bonus 0–20</h2>'+s.selected.map((id,i)=>'<p>'+esc(s.players.find(p=>p.id===id)?.name||'—')+'</p><input id="mark'+i+'" type="number" value="0" min="0" max="20"><button onclick="mark('+i+')">Simpan Bonus</button>').join('')+'</div>';
if(idx===11)h+=modelAnswer();
if(idx===12)h+=board(s);
h+='<div class="card"><h2>🎮 Kawalan Trainer</h2><p class="small">Langkah '+(idx+1)+' daripada '+phases.length+' — '+labels[idx]+'</p><div class="progress-track"><div class="progress-fill" style="width:'+((idx+1)/phases.length*100)+'%"></div></div>'+(idx<phases.length-1?'<button class="primary next-btn" onclick="change(\''+phases[idx+1]+'\')">SETERUSNYA →</button>':'<div class="quote">🏆 Misi selesai! Markah dipaparkan pada leaderboard.</div>')+(idx===0?'<p class="small">Pastikan semua peserta sudah JOIN sebelum meneruskan.</p>':'')+'</div>';$('admin').innerHTML=h}
function renderPlayer(s){missionData=missions.find(m=>m.id===s.mission)||current();if(!s.me){if(token){token='';sessionStorage.removeItem('token');localStorage.removeItem('andalusia_player_token')} $('join').className='card';if(s.code && !$('code').matches(':focus')) $('code').value=s.code;$('play').innerHTML=s.phase==='lobby'?'<div class="card"><p>Masukkan nama dan tekan JOIN. Kod sesi aktif telah dikemas kini secara automatik.</p></div>':'';return}$('join').className='hidden';let h=timerBox(s)+'<div class="card">Selamat datang, <b>'+esc(s.me.name)+'</b><p>'+labels[phases.indexOf(s.phase)]+'</p></div>';switch(s.phase){case'lobby':h+='<div class="card">Menunggu trainer...</div>';break;case'story':h+=story();break;case'response':h+=story()+quiz(s.me);break;case'results':h+=results(s);break;case'disc':h+=disc(s.me);break;case'discresults':h+=discResults(s);break;case'reveal':h+=reveal();break;case'rescue':h+=rescue();break;case'closing1':case'closing2':h+='<div class="card"><h2>Live Closing Challenge</h2><p>'+esc(current().closings[s.phase==='closing1'?0:1])+'</p>Jawab secara lisan apabila dipanggil.</div>';break;case'bonus':h+='<div class="card">Trainer sedang memberikan markah.</div>';break;case'modelanswer':h+=modelAnswer();break;case'leaderboard':h+=board(s)}$('play').innerHTML=h}
let lastMission=0;let lastPhase='',lastCount=-1,lastAnswers=-1,lastDisc=-1;
async function refresh(){if(!role)return;try{let next=await api('state');let focused=document.activeElement;let editing=role==='trainer'&&focused&&['SELECT','INPUT'].includes(focused.tagName)&&focused.id!=='pin';let same=next.phase===lastPhase;let unchanged=same&&next.count===lastCount&&next.answered===lastAnswers&&next.discAnswered===lastDisc;state=next;clockOffset=next.serverNow-Date.now();
if(editing&&same)return;
if(role==='trainer'&&unchanged&&next.mission===lastMission)return;
$('error').textContent='';if(role==='trainer')renderTrainer(state);else renderPlayer(state);
lastMission=next.mission;lastPhase=next.phase;lastCount=next.count;lastAnswers=next.answered;lastDisc=next.discAnswered;
}catch(e){if(role==='trainer')$('admin').innerHTML='<div class="card">Masukkan PIN trainer yang ditetapkan pada hosting.</div>';else error(e)}}
loadMissions().then(()=>refresh());setInterval(refresh,2000);setInterval(updateClock,300);if(location.search.includes('code=')||token)openPlayer();
</script></html>
