<!doctype html><html lang="ms"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>Andalusia DISC Battle</title><style>body{font:17px system-ui;margin:0;background:#f8f3e8;color:#123f33}header{background:#074435;color:#ebc97f;text-align:center;padding:20px}main{max-width:840px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #d8c290;border-radius:18px;padding:20px;margin:14px 0}button,input,select{font:inherit;padding:12px;border-radius:9px;border:1px solid #bca576;margin:5px}button{cursor:pointer;background:#f7f1e4}button.primary{background:#07533e;color:white}input{width:92%}h2{margin:5px 0 12px}.quote{background:#f6e9c8;padding:20px;border-radius:12px}.choices button{display:block;text-align:left;width:99%;margin:9px 0}.hidden{display:none}.small{color:#667c71;font-size:14px}body{background:radial-gradient(circle at top,#e8d9ad,#f5f0e5 48%,#e7eadf);min-height:100vh}header{background:linear-gradient(135deg,#032b26,#08644c 55%,#082b28);padding:32px 18px;border-bottom:5px solid #c59b47;box-shadow:0 8px 24px #12382b25}header h1{font-size:clamp(25px,4.1vw,42px);letter-spacing:1.5px;text-shadow:0 3px 10px #0003}main{max-width:1040px}.card{box-shadow:0 9px 28px #17433618;border:1px solid #d7bd7d;border-radius:22px;padding:27px;animation:appear .35s ease-out}.card h2{color:#0a5542}button{transition:transform .15s,box-shadow .15s;background:#fff8e9}button:hover{transform:translateY(-2px);box-shadow:0 5px 13px #123d3228}button:active{transform:scale(.98)}button.primary{background:linear-gradient(120deg,#07533e,#088062);font-weight:700}.quote{font-size:clamp(19px,2.5vw,26px);font-weight:600;line-height:1.6;box-shadow:inset 0 0 0 1px #dbbe6e}.choices button{padding:20px;font-size:17px;line-height:1.5}.choices button:hover{border:2px solid #ad8439}.small{font-size:14px}.stats{display:flex;gap:12px;flex-wrap:wrap}.stats span{background:#eef5ee;border-radius:12px;padding:12px 16px;font-weight:700}#admin> .card:first-child{background:linear-gradient(135deg,#f8f0d6,#fff)}#admin img{border:8px solid #f5e4b6;border-radius:12px}#admin .card:last-child button{margin:6px}#admin .card:last-child button.primary{background:#075b42}.hidden{display:none!important}@keyframes appear{from{opacity:.35;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){main{padding:10px}.card{padding:18px}header{padding:24px 8px}button{min-height:44px}} .joined-list{display:flex;flex-wrap:wrap;gap:10px;padding-top:10px}.joined-name{display:inline-block;background:#e8f4e8;color:#07533e;padding:12px 16px;border:1px solid #a6bf9a;border-radius:12px;font-weight:700;animation:appear .3s ease}.joined-name:before{content:'✓ ';color:#0a8a54} .next-btn{display:block;width:100%;font-size:clamp(18px,2.6vw,25px);font-weight:800;padding:20px;margin:17px 0;border-radius:16px;background:linear-gradient(110deg,#086145,#0c8a67)!important;box-shadow:0 7px 18px #0a60402a;letter-spacing:.4px}.progress-track{height:10px;background:#e7e8da;border-radius:99px;overflow:hidden}.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#b8964a,#e3c46b)} </style><header><h1>ANDALUSIA DISC SALES BATTLE</h1><div>MISSION 01 • WHATSAPP • EMERALD & GOLD</div></header><main><section id="entry" class="card"><h2>Pilih paparan</h2><button onclick="openTrainer()">Trainer</button><button onclick="openPlayer()">Peserta</button></section><section id="trainer" class="hidden"><div class="card"><h2>Trainer Control</h2><input id="pin" placeholder="Masukkan PIN trainer" type="password"><button class="primary" onclick="auth()">Log masuk</button></div><div id="admin"></div></section><section id="player" class="hidden"><div id="join" class="card"><h2>Join Game</h2><input id="name" placeholder="Nama peserta"><input id="code" placeholder="Kod sesi"><button class="primary" onclick="join()">JOIN</button></div><div id="play"></div></section><p id="error"></p></main><script>
let role='',pin=sessionStorage.pin||'',token=localStorage.getItem('andalusia_player_token')||sessionStorage.token||'',state=null;const $=id=>document.getElementById(id);
const phases=['lobby','story','response','results','disc','discresults','reveal','rescue','closing1','closing2','bonus','leaderboard'];
const labels=['LOBI QR','MESEJ PELANGGAN','SOALAN A/B/C','KEPUTUSAN UNDIAN','TEKA DISC','KEPUTUSAN DISC','REVEAL DISC','RESCUE CARD','CLOSING 1','CLOSING 2','MARKAH BONUS','LEADERBOARD'];
const quote='“Assalamualaikum. Saya nak tengok pakej umrah untuk bulan Disember. Masa saya agak terhad, jadi boleh berikan tarikh, jumlah harga sebenar dan lokasi hotel secara ringkas? Saya nak bandingkan dahulu sebelum buat keputusan.”';
const answers={A:'Waalaikumussalam tuan. Kami boleh hantar tiga pakej Disember berserta harga bermula, hotel dan jadual. Tuan boleh teliti setiap pilihan dahulu.',B:'Waalaikumussalam tuan. Saya ringkaskan pakej Disember mengikut tarikh, jumlah harga termasuk caj wajib, lokasi hotel dan perkara yang tidak termasuk supaya tuan boleh bandingkan dengan cepat.',C:'Waalaikumussalam tuan. Saya cadangkan pakej yang paling popular pada Disember, lengkap dengan butiran hotel dan jadual. Selepas itu kita boleh bincang anggaran bajet tuan.'};
const closings=['Saya nak pilihan yang praktikal, tetapi saya tiada masa untuk teliti semua pakej. Apa yang awak cadangkan?','Saya masih banding dengan agensi lain. Apa yang membezakan pakej ini dan apa langkah seterusnya?'];
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path,data){let r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','x-trainer-pin':pin,'x-player-token':token},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
function error(e){$('error').textContent=e.message||e}
function openTrainer(){role='trainer';$('entry').className='hidden';$('trainer').className='';$('player').className='hidden';$('pin').value=pin;refresh()}
function openPlayer(){role='player';$('entry').className='hidden';$('trainer').className='hidden';$('player').className='';$('code').value=new URLSearchParams(location.search).get('code')||'';refresh()}
function auth(){pin=$('pin').value;sessionStorage.pin=pin;refresh()}
async function join(){try{let j=await api('join',{name:$('name').value,code:$('code').value});token=j.token;sessionStorage.token=token;localStorage.setItem('andalusia_player_token',token);refresh()}catch(e){error(e)}}
async function answer(value){try{await api('answer',{answer:value});refresh()}catch(e){error(e)}}
async function change(p){try{await api('phase',{phase:p});refresh()}catch(e){error(e)}}
async function select(){try{await api('select',{ids:[$('p1').value,$('p2').value]});refresh()}catch(e){error(e)}}
async function mark(i){try{await api('bonus',{id:state.selected[i],score:Number($('mark'+i).value)});refresh()}catch(e){error(e)}}
const story=()=>'<div class="card"><h2>📱 WhatsApp Masuk — Pelanggan Andalusia</h2><p class="small">Baca mesej sebenar di bawah. Kenal pasti semua maklumat yang pelanggan minta sebelum memilih jawapan.</p><div class="quote">'+quote+'</div></div>';
const rescue=()=>'<div class="card"><h2>✦ RESCUE CARD — Jawapan B</h2><p><b>Perkara penting yang perlu dikesan:</b> tarikh Disember, jumlah harga sebenar, lokasi hotel, penerangan ringkas dan keperluan membandingkan pilihan sebelum membuat keputusan.</p><p><b>A</b> nampak membantu, tetapi hanya menyatakan harga bermula dan tidak memastikan jumlah kos lengkap. <b>C</b> memulakan cadangan berdasarkan populariti tanpa memenuhi permintaan perbandingan dan harga sebenar. <b>B</b> paling lengkap serta ringkas, dengan penjelasan kos wajib dan pengecualian.</p><div class="quote">'+answers.B+'</div></div>';
const results=s=>'<div class="card"><h2>📊 KEPUTUSAN UNDIAN A/B/C</h2><p><b>'+s.answered+' daripada '+s.count+' peserta telah menjawab</b></p>'+['A','B','C'].map(k=>{let n=s.responseCounts?.[k]||0,p=s.answered?Math.round(n/s.answered*100):0;return '<div style="margin:20px 0"><p><b>Jawapan '+k+'</b> — '+n+' peserta ('+p+'%)</p><div class="progress-track" style="height:22px"><div class="progress-fill" style="width:'+p+'%;background:#b59a68"></div></div></div>'}).join('')+'<p class="small">Jawapan terbaik belum didedahkan. Seterusnya, peserta akan meneka DISC pelanggan.</p></div>';
const discResults=s=>'<div class="card"><h2>📊 KEPUTUSAN UNDIAN DISC</h2><p><b>'+s.discAnswered+' daripada '+s.count+' peserta telah memilih DISC</b></p>'+['D','I','S','C'].map(k=>{let n=s.discCounts?.[k]||0,p=s.discAnswered?Math.round(n/s.discAnswered*100):0;return '<div style="margin:20px 0"><p><b>DISC '+k+'</b> — '+n+' peserta ('+p+'%)</p><div class="progress-track" style="height:22px"><div class="progress-fill" style="width:'+p+'%;background:#b59a68"></div></div></div>'}).join('')+'<p class="small">Gaya DISC watak belum didedahkan. Trainer tekan Seterusnya untuk Reveal DISC.</p></div>';
const reveal=()=>'<div class="card"><h2>DISC: D — Dominance</h2><p>Watak ini mengutamakan masa, keputusan dan pilihan yang jelas. Jangan andaikan personaliti daripada pendapatan atau satu mesej sahaja.</p></div>';
const quiz=(me)=>'<div class="card"><h2>Apakah balasan WhatsApp yang PALING menepati permintaan pelanggan?</h2><p class="small">Ketiga-tiga jawapan kelihatan munasabah. Baca setiap satu dengan teliti.</p><div class="choices">'+Object.entries(answers).map(([k,v])=>'<button '+(me?.response?'disabled':'')+' onclick="answer(\''+k+'\')">'+k+'. '+v+'</button>').join('')+'</div>'+(me?.response?'<p>Jawapan dihantar: '+esc(me.response)+'</p>':'')+'</div>';
const disc=me=>'<div class="card"><h2>Kenal pasti DISC pelanggan</h2>'+['D','I','S','C'].map(x=>'<button '+(me?.disc?'disabled':'')+' onclick="answer(\''+x+'\')">'+x+'</button>').join('')+(me?.disc?'<p>Jawapan dihantar: '+esc(me.disc)+'</p>':'')+'</div>';
const board=s=>'<div class="card"><h2>Leaderboard</h2>'+s.ranking.map((p,i)=>'<p>'+(i+1)+'. '+esc(p.name)+' — '+esc(p.total??'menunggu')+' mata</p>').join('')+'</div>';
function renderTrainer(s){let idx=phases.indexOf(s.phase),url=location.origin+'/?code='+s.code;let h='<div class="card"><h2>'+labels[idx]+'</h2><p>👥 Peserta: '+s.count+' &nbsp; | &nbsp; ✅ A/B/C: '+s.answered+' &nbsp; | &nbsp; 🧠 DISC: '+s.discAnswered+'</p></div>';
if(idx===0)h+='<div class="card"><h2>✅ SENARAI PESERTA TELAH MASUK ('+s.count+')</h2><div class="joined-list">'+(s.players.length?s.players.map((p,i)=>'<span class="joined-name">'+(i+1)+'. '+esc(p.name)+'</span>').join(''):'<p>Menunggu peserta scan QR...</p>')+'</div></div><div class="card"><h2>Scan QR / Join Game</h2><img alt="QR" width="180" height="180" src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data='+encodeURIComponent(url)+'"><p>Kod sesi: <b>'+s.code+'</b></p><p>'+esc(url)+'</p></div>';
if(idx>=1&&idx<=8)h+=story();
if(idx===2)h+=quiz({response:'X'});
if(idx===3)h+=results(s);
if(idx===4)h+=disc({disc:'X'});
if(idx===5)h+=discResults(s);
if(idx===6)h+=reveal();
if(idx===7)h+=rescue();
if(idx===8||idx===9)h+='<div class="card"><h2>Live Closing '+(idx-7)+'</h2><div class="quote">'+closings[idx-8]+'</div><p>60 saat untuk menjawab secara lisan.</p></div>';
if(idx>=8&&idx<=10){let list='<option value="">Pilih peserta</option>'+s.players.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('');h+='<div class="card"><h2>Pilih dua peserta</h2><select id="p1">'+list+'</select><select id="p2">'+list+'</select><button onclick="select()">Simpan Pilihan</button><p>Terpilih: '+s.selected.map(id=>esc(s.players.find(p=>p.id===id)?.name||'—')).join(' / ')+'</p></div>'}
if(idx===10)h+='<div class="card"><h2>Bonus 0–20</h2>'+s.selected.map((id,i)=>'<p>'+esc(s.players.find(p=>p.id===id)?.name||'—')+'</p><input id="mark'+i+'" type="number" value="0" min="0" max="20"><button onclick="mark('+i+')">Simpan Bonus</button>').join('')+'</div>';
if(idx===11)h+=board(s);
h+='<div class="card"><h2>🎮 Kawalan Trainer</h2><p class="small">Langkah '+(idx+1)+' daripada '+phases.length+' — '+labels[idx]+'</p><div class="progress-track"><div class="progress-fill" style="width:'+((idx+1)/phases.length*100)+'%"></div></div>'+(idx<phases.length-1?'<button class="primary next-btn" onclick="change(\''+phases[idx+1]+'\')">SETERUSNYA → '+labels[idx+1]+'</button>':'<div class="quote">🏆 Misi selesai! Markah dipaparkan pada leaderboard.</div>')+(idx===0?'<p class="small">Pastikan semua peserta sudah JOIN sebelum meneruskan.</p>':'')+'</div>';$('admin').innerHTML=h}
function renderPlayer(s){if(!s.me){if(token){token='';sessionStorage.removeItem('token');localStorage.removeItem('andalusia_player_token')} $('join').className='card';if(s.code && !$('code').matches(':focus')) $('code').value=s.code;$('play').innerHTML=s.phase==='lobby'?'<div class="card"><p>Masukkan nama dan tekan JOIN. Kod sesi aktif telah dikemas kini secara automatik.</p></div>':'';return}$('join').className='hidden';let h='<div class="card">Selamat datang, <b>'+esc(s.me.name)+'</b><p>'+labels[phases.indexOf(s.phase)]+'</p></div>';switch(s.phase){case'lobby':h+='<div class="card">Menunggu trainer...</div>';break;case'story':h+=story();break;case'response':h+=story()+quiz(s.me);break;case'results':h+=results(s);break;case'disc':h+=disc(s.me);break;case'discresults':h+=discResults(s);break;case'reveal':h+=reveal();break;case'rescue':h+=rescue();break;case'closing1':case'closing2':h+='<div class="card"><h2>Live Closing Challenge</h2><p>'+esc(closings[s.phase==='closing1'?0:1])+'</p>Jawab secara lisan apabila dipanggil.</div>';break;case'bonus':h+='<div class="card">Trainer sedang memberikan markah.</div>';break;case'leaderboard':h+=board(s)}$('play').innerHTML=h}
let lastPhase='',lastCount=-1,lastAnswers=-1,lastDisc=-1;
async function refresh(){if(!role)return;try{let next=await api('state');let focused=document.activeElement;let editing=role==='trainer'&&focused&&['SELECT','INPUT'].includes(focused.tagName)&&focused.id!=='pin';let same=next.phase===lastPhase;let unchanged=same&&next.count===lastCount&&next.answered===lastAnswers&&next.discAnswered===lastDisc;state=next;
if(editing&&same)return;
if(role==='trainer'&&unchanged)return;
$('error').textContent='';if(role==='trainer')renderTrainer(state);else renderPlayer(state);
lastPhase=next.phase;lastCount=next.count;lastAnswers=next.answered;lastDisc=next.discAnswered;
}catch(e){if(role==='trainer')$('admin').innerHTML='<div class="card">Masukkan PIN trainer yang ditetapkan pada hosting.</div>';else error(e)}}
setInterval(refresh,2000);if(location.search.includes('code=')||token)openPlayer();
</script></html>
